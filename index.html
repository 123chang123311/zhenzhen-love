<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>致 陈珍珍 💌</title>
<meta name="description" content="给陈珍珍的一封告白信">
<style>
  :root{
    --gold:#ffd9a0;
    --pink:#ff8fb1;
    --deep:#0b1026;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:radial-gradient(ellipse at 50% 0%, #1b2350 0%, #0b1026 55%, #050714 100%);
    color:#fff;
    overflow:hidden;
    position:relative;
    user-select:none;
  }

  #stars{position:fixed;inset:0;z-index:1;display:block;}

  /* 漂浮爱心层 */
  .hearts{position:fixed;inset:0;z-index:2;pointer-events:none;}
  .heart{
    position:absolute;bottom:-40px;
    font-size:22px;
    animation:floatUp linear forwards;
    opacity:0;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg) scale(.6);opacity:0;}
    10%{opacity:.9;}
    100%{transform:translateY(-115vh) rotate(30deg) scale(1.1);opacity:0;}
  }

  .wrap{
    position:relative;z-index:3;
    height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
    overflow-y:auto;
  }
  .eyebrow{letter-spacing:.4em;text-indent:.4em;font-size:13px;color:var(--gold);opacity:.8;margin-bottom:18px;animation:fade 1.5s ease both;}
  .title{
    font-size:clamp(40px,10vw,72px);font-weight:700;letter-spacing:.08em;
    background:linear-gradient(180deg,#fff 0%,var(--pink) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(255,143,177,.35);
    animation:fade 1.5s .2s ease both;
  }
  .subtitle{margin-top:10px;font-size:clamp(14px,4vw,17px);color:#c7cdf5;opacity:.9;animation:fade 1.5s .4s ease both;}

  .card{
    margin-top:30px;max-width:540px;width:100%;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.14);border-radius:20px;
    padding:28px 26px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    animation:fade 1.5s .6s ease both;
  }
  #typed{min-height:92px;font-size:clamp(15px,4.5vw,18px);line-height:2;color:#eef0ff;text-align:left;white-space:pre-wrap;}
  .cursor{display:inline-block;width:2px;height:1.1em;background:var(--pink);vertical-align:-2px;animation:blink .8s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* 提问区 */
  .question{
    margin-top:34px;
    opacity:0;transform:translateY(20px);
    transition:opacity .8s ease, transform .8s ease;
  }
  .question.show{opacity:1;transform:translateY(0);}
  .big-love{
    font-size:clamp(24px,7vw,36px);font-weight:800;
    background:linear-gradient(180deg,#ffd9a0,#ff8fb1);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .ask{margin-top:12px;font-size:clamp(16px,5vw,20px);line-height:1.8;color:#ffe9f1;}

  .btns{
    display:flex;gap:20px;justify-content:center;align-items:center;
    margin-top:28px;flex-wrap:wrap;
  }
  .yes,.no{
    padding:16px 40px;font-size:19px;letter-spacing:.05em;
    border:none;border-radius:999px;cursor:pointer;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    will-change:transform;white-space:nowrap;position:relative;
  }
  .yes{
    background:linear-gradient(135deg,#ff8fb1,#ff6b9d);color:#fff;
    box-shadow:0 10px 30px rgba(255,107,157,.5);z-index:2;
  }
  .yes:hover{box-shadow:0 14px 40px rgba(255,107,157,.65);}
  .no{
    background:rgba(255,255,255,.12);color:#d7dcff;
    border:1px solid rgba(255,255,255,.22);z-index:1;
  }
  .shake{animation:shake .4s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    50%{transform:translateX(8px);}
    75%{transform:translateX(-5px);}
  }

  .sign{margin-top:34px;font-size:14px;color:var(--gold);opacity:.75;letter-spacing:.15em;animation:fade 1.5s 1s ease both;}

  @keyframes fade{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  /* 庆祝页面 */
  .celebrate{
    position:fixed;inset:0;z-index:10;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(190,20,70,.45) 0%, rgba(190,20,70,0) 60%),
      radial-gradient(ellipse at 50% -10%, #4a1730 0%, #2a0f2e 48%, #0b0714 100%);
    padding:24px;overflow:hidden;
  }
  .celebrate.show{display:flex;}
  .celebrate #fireworks{position:absolute;inset:0;width:100%;height:100%;z-index:1;}
  .celebrate #petals{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;}

  .celebrate-inner{
    position:relative;z-index:3;
    display:flex;flex-direction:column;align-items:center;
    animation:popIn 1.1s cubic-bezier(.34,1.56,.64,1) both;
  }
  .glow{
    position:absolute;top:50%;left:50%;
    width:360px;height:360px;margin:-180px 0 0 -180px;
    border-radius:50%;z-index:0;
    background:radial-gradient(circle, rgba(255,120,160,.55) 0%, rgba(255,120,160,0) 70%);
    animation:breathe 2.6s ease-in-out infinite;
  }
  .celebrate .big-title{
    position:relative;z-index:2;
    font-size:clamp(34px,10vw,58px);font-weight:800;letter-spacing:.06em;
    background:linear-gradient(90deg,#ffd9a0,#fff,#ffb3c9,#ffd9a0);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 24px rgba(255,143,177,.55));
    animation:shimmer 3.5s linear infinite;
  }
  .love-line{
    position:relative;z-index:1;
    margin-top:16px;
    font-size:clamp(26px,7.5vw,44px);
    font-weight:700;letter-spacing:.04em;
    background:linear-gradient(90deg,#fff,#ffd9a0,#ff8fb1,#fff);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,143,177,.5));
    animation:shimmer 4s linear infinite, floaty 3s ease-in-out infinite;
  }
  .love-line .name{
    font-size:1.3em;letter-spacing:.06em;
    filter:drop-shadow(0 0 24px rgba(255,143,177,.7));
  }
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .celebrate .names{
    position:relative;z-index:2;
    margin-top:6px;font-size:clamp(20px,6vw,30px);font-weight:700;color:#ffe9f1;letter-spacing:.12em;
    filter:drop-shadow(0 2px 16px rgba(255,143,177,.45));
  }
  .celebrate .names .heart{color:#ff4d79;display:inline-block;animation:breathe 1.6s ease-in-out infinite;}
  .celebrate .date-line{margin-top:14px;font-size:clamp(14px,4vw,17px);color:#f0c8d8;opacity:.92;}

  @keyframes popIn{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.18);opacity:1;}}
  @keyframes shimmer{0%{background-position:0% 0;}100%{background-position:300% 0;}}

  .music-btn{
    position:fixed;bottom:28px;right:28px;z-index:12;
    width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.12);color:#fff;font-size:22px;
    cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:transform .2s ease;
  }
  .music-btn:hover{transform:scale(1.1);}

  /* 心形爆炸粒子 */
  .burst{position:fixed;z-index:9;pointer-events:none;}
  .burst span{position:absolute;font-size:20px;animation:burstOut 1.4s ease-out forwards;}
  @keyframes burstOut{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}
  }
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="hearts" id="hearts"></div>

  <div class="wrap">
    <div class="eyebrow">一 封 写 给 你 的 星 光 情 书</div>
    <h1 class="title">陈珍珍</h1>
    <p class="subtitle">有些话，星星替我说了千万遍，今天想亲口告诉你</p>

    <div class="card">
      <div id="typed"></div>
    </div>

    <div class="question" id="question">
      <div class="big-love">我喜欢你，认真且坚定</div>
      <p class="ask">陈珍珍，你愿意做我的女朋友吗？</p>
      <div class="btns">
        <button class="yes" id="yesBtn">我愿意 ❤️</button>
        <button class="no" id="noBtn">不愿意</button>
      </div>
    </div>

    <div class="sign">—— 爱你的 常告白</div>
  </div>

  <div class="celebrate" id="celebrate">
    <canvas id="fireworks"></canvas>
    <canvas id="petals"></canvas>
    <div class="celebrate-inner">
      <div class="glow"></div>
      <h2 class="big-title">我们在一起啦</h2>
      <h3 class="love-line"><span class="name">珍珍</span>，有你真好</h3>
      <div class="names">常告白 <span class="heart">❤</span> 陈珍珍</div>
      <div class="date-line">从今天起，一起看星星吧</div>
    </div>
  </div>
  <button class="music-btn" id="musicBtn" style="display:none">🔊</button>
  <audio id="musicAudio" src="music.mp3" loop preload="auto"></audio>

<script>
(function(){
  var dpr = window.devicePixelRatio || 1;

  /* ---------- 星空画布 ---------- */
  var canvas = document.getElementById('stars');
  var ctx = canvas.getContext('2d');
  var stars = [], meteors = [];
  var W, H;
  function resize(){
    W = canvas.width = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
  }
  resize();
  window.addEventListener('resize', function(){ resize(); initStars(); });

  function initStars(){
    stars = [];
    var count = Math.floor(W * H / 4500);
    for(var i=0;i<count;i++){
      stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6*dpr+0.4*dpr,
        a:Math.random(), s:Math.random()*0.02+0.005, tw:Math.random()*Math.PI*2});
    }
  }
  initStars();

  function spawnMeteor(){
    meteors.push({x:Math.random()*W, y:Math.random()*H*0.3, len:(60+Math.random()*80)*dpr,
      vx:-(3+Math.random()*3)*dpr, vy:(2+Math.random()*2)*dpr, life:1});
  }
  setInterval(function(){ if(meteors.length<3 && Math.random()<0.5) spawnMeteor(); }, 1200);

  function drawStars(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var st=stars[i]; st.tw+=st.s;
      var alpha=st.a*(0.55+0.45*Math.sin(st.tw));
      ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+alpha.toFixed(3)+')'; ctx.fill();
    }
    for(var j=meteors.length-1;j>=0;j--){
      var m=meteors[j]; m.x+=m.vx; m.y+=m.vy; m.life-=0.012;
      if(m.life<=0){ meteors.splice(j,1); continue; }
      var gx=m.x-m.vx*m.len, gy=m.y-m.vy*m.len;
      var grad=ctx.createLinearGradient(m.x,m.y,gx,gy);
      grad.addColorStop(0,'rgba(255,255,255,'+(0.9*m.life).toFixed(3)+')');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=grad; ctx.lineWidth=1.4*dpr;
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(gx,gy); ctx.stroke();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  /* ---------- 漂浮爱心 ---------- */
  var heartsBox = document.getElementById('hearts');
  var heartChars = ['❤','💗','💖','💕','✨'];
  function spawnHeart(){
    var el=document.createElement('div'); el.className='heart';
    el.textContent=heartChars[Math.floor(Math.random()*heartChars.length)];
    el.style.left=(Math.random()*100)+'%';
    el.style.fontSize=(16+Math.random()*20)+'px';
    var dur=6+Math.random()*6; el.style.animationDuration=dur+'s';
    heartsBox.appendChild(el);
    setTimeout(function(){ el.remove(); }, dur*1000);
  }
  setInterval(spawnHeart, 800);
  for(var k=0;k<5;k++) setTimeout(spawnHeart, k*300);

  /* ---------- 打字机表白 ---------- */
  var msg = "遇见你，是我平凡日子里最意外的惊喜。\n你笑起来的样子，比整片星空都还要明亮。\n我喜欢你，认真且坚定。\n所以，想鼓起勇气亲口问问你——";
  var typed = document.getElementById('typed');
  var idx = 0;
  function type(){
    if(idx < msg.length){
      typed.innerHTML = msg.slice(0, idx+1).replace(/\n/g,'<br>') + '<span class="cursor"></span>';
      idx++;
      setTimeout(type, 55);
    } else {
      typed.innerHTML = msg.replace(/\n/g,'<br>');
      document.getElementById('question').classList.add('show');
    }
  }
  setTimeout(type, 1400);

  /* ---------- 愿意 / 不愿意 互动 ---------- */
  var yesBtn = document.getElementById('yesBtn');
  var noBtn = document.getElementById('noBtn');
  var noClicks = 0;
  var yesScale = 1, noScale = 1;
  var phrases = [
    "不愿意 😕", "真的不愿意吗 🥺", "再想想嘛 🥺", "我会哭的 😭",
    "你舍得吗 😭", "心好痛，再考虑下 💔", "求求你再想想 🥺", "别这么狠心嘛 😢",
    "呜呜呜…再想想 😭", "我真的很喜欢你 🥺", "求你了，选愿意吧 🙏", "选它嘛，选那个大的 👉"
  ];

  noBtn.addEventListener('click', function(){
    noClicks++;
    yesScale = Math.min(yesScale + 0.22, 3.2);
    noScale = Math.max(noScale - 0.16, 0.06);

    yesBtn.style.transform = 'scale(' + yesScale + ')';
    noBtn.style.transform = 'scale(' + noScale + ')';
    noBtn.style.opacity = noScale;
    noBtn.textContent = phrases[Math.min(noClicks-1, phrases.length-1)];

    noBtn.classList.remove('shake');
    void noBtn.offsetWidth; // 重触发动画
    noBtn.classList.add('shake');

    // 缩到一定程度后，不愿意按钮彻底点不了
    if(noScale <= 0.2){
      noBtn.style.pointerEvents = 'none';
    }
    burstHearts(noBtn, 6);
  });

  yesBtn.addEventListener('click', function(){
    celebrate();
  });

  /* ---------- 庆祝 + 音乐 ---------- */
  function celebrate(){
    document.getElementById('celebrate').classList.add('show');
    document.getElementById('musicBtn').style.display = 'block';
    burstHearts(yesBtn, 30);
    for(var b=0;b<14;b++) setTimeout(spawnHeart, b*70);
    startFireworks();
    startPetals();
    startMusic();
  }

  function burstHearts(el, n){
    var rect = el.getBoundingClientRect();
    var cx = rect.left + rect.width/2;
    var cy = rect.top + rect.height/2;
    var box = document.createElement('div'); box.className='burst';
    box.style.left=cx+'px'; box.style.top=cy+'px';
    document.body.appendChild(box);
    for(var i=0;i<n;i++){
      var s=document.createElement('span');
      s.textContent = i%2 ? '❤' : '💗';
      var ang=Math.random()*Math.PI*2, dist=(60+Math.random()*160)*dpr;
      s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
      s.style.fontSize=(14+Math.random()*16)+'px';
      box.appendChild(s);
    }
    setTimeout(function(){ box.remove(); }, 1500);
  }

  /* ---------- 烟花（绚烂背景） ---------- */
  var fwCanvas = document.getElementById('fireworks');
  var fctx = fwCanvas.getContext('2d');
  var fwParts = [], fwRockets = [];
  var fwRunning = false;
  var fwColors = ['#ff8fb1','#ffd9a0','#ff4d79','#fff2f6','#ffb3c9','#ffd700','#ff6b9d'];

  function sizeFw(){
    fwCanvas.width = window.innerWidth * dpr;
    fwCanvas.height = window.innerHeight * dpr;
  }
  sizeFw();
  window.addEventListener('resize', sizeFw);

  function launchFw(){
    fwRockets.push({
      x: (0.15 + Math.random()*0.7) * fwCanvas.width,
      y: fwCanvas.height,
      vx: (Math.random()-0.5)*2*dpr,
      vy: -(10 + Math.random()*5)*dpr,
      targetY: (0.15 + Math.random()*0.35) * fwCanvas.height,
      color: fwColors[Math.floor(Math.random()*fwColors.length)]
    });
  }
  function explodeFw(x, y, color){
    var n = 50 + Math.floor(Math.random()*40);
    for(var i=0;i<n;i++){
      var ang = Math.random()*Math.PI*2;
      var sp = (1.5 + Math.random()*4.5)*dpr;
      fwParts.push({x:x, y:y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:1,
        decay:0.008 + Math.random()*0.014, color:color});
    }
  }
  function drawFw(){
    if(!fwRunning) return;
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,0.22)';
    fctx.fillRect(0,0,fwCanvas.width,fwCanvas.height);
    fctx.globalCompositeOperation = 'lighter';

    for(var i=fwRockets.length-1;i>=0;i--){
      var r = fwRockets[i];
      r.x += r.vx; r.y += r.vy; r.vy += 0.06*dpr;
      fctx.beginPath(); fctx.arc(r.x, r.y, 2.2*dpr, 0, Math.PI*2);
      fctx.fillStyle = r.color; fctx.fill();
      if(r.y <= r.targetY || r.vy > -1){
        explodeFw(r.x, r.y, r.color);
        fwRockets.splice(i,1);
      }
    }
    for(var j=fwParts.length-1;j>=0;j--){
      var p = fwParts[j];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.vy *= 0.985;
      p.vy += 0.05*dpr; p.life -= p.decay;
      if(p.life <= 0){ fwParts.splice(j,1); continue; }
      fctx.globalAlpha = p.life;
      fctx.beginPath(); fctx.arc(p.x, p.y, 1.8*dpr*p.life, 0, Math.PI*2);
      fctx.fillStyle = p.color; fctx.fill();
    }
    fctx.globalAlpha = 1;
    requestAnimationFrame(drawFw);
  }
  function startFireworks(){
    fwRunning = true;
    drawFw();
    launchFw();
    setInterval(function(){
      if(fwRunning && Math.random() < 0.85) launchFw();
    }, 520);
  }

  /* ---------- 玫瑰花瓣雨 ---------- */
  var petCanvas = document.getElementById('petals');
  var pctx = petCanvas.getContext('2d');
  var petals = [];
  var petRunning = false;
  var petalGrads = [
    ['#c2185b','#f06292'], ['#ad1457','#e91e63'], ['#880e4f','#d81b60'],
    ['#d81b60','#ff80ab'], ['#b71c1c','#e57373']
  ];

  function sizePet(){
    petCanvas.width = window.innerWidth * dpr;
    petCanvas.height = window.innerHeight * dpr;
  }
  sizePet();
  window.addEventListener('resize', sizePet);

  function drawPetalShape(c, w, h, g1, g2){
    var grad = c.createLinearGradient(0, -h/2, 0, h/2);
    grad.addColorStop(0, g2); grad.addColorStop(1, g1);
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(0, -h/2);
    c.bezierCurveTo(w*0.6, -h/2, w*0.6, h*0.1, 0, h/2);
    c.bezierCurveTo(-w*0.6, h*0.1, -w*0.6, -h/2, 0, -h/2);
    c.closePath();
    c.fill();
  }
  function makePetal(){
    var g = petalGrads[Math.floor(Math.random()*petalGrads.length)];
    return {
      x: Math.random()*petCanvas.width, y: -40*dpr,
      w: (10 + Math.random()*12)*dpr, h: (16 + Math.random()*14)*dpr,
      vy: (1.2 + Math.random()*2.2)*dpr, vx: (Math.random()-0.5)*1.2*dpr,
      rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.08,
      sway: Math.random()*Math.PI*2, swaySpd: 0.01 + Math.random()*0.02,
      g: g
    };
  }
  function drawPetals(){
    if(!petRunning) return;
    pctx.clearRect(0,0,petCanvas.width,petCanvas.height);
    if(petals.length < 120) petals.push(makePetal());
    for(var i=petals.length-1;i>=0;i--){
      var p = petals[i];
      p.sway += p.swaySpd;
      p.y += p.vy; p.x += p.vx + Math.sin(p.sway)*0.8*dpr; p.rot += p.vr;
      if(p.y > petCanvas.height + 50*dpr){ petals.splice(i,1); continue; }
      pctx.save();
      pctx.translate(p.x, p.y); pctx.rotate(p.rot);
      drawPetalShape(pctx, p.w, p.h, p.g[0], p.g[1]);
      pctx.restore();
    }
    requestAnimationFrame(drawPetals);
  }
  function startPetals(){
    petRunning = true;
    for(var i=0;i<30;i++) petals.push(makePetal());
    drawPetals();
  }

  /* ---------- 音乐（Web Audio 合成，无需音频文件） ---------- */
  var audioCtx = null, master = null, musicOn = true, musicTimer = null;
  function mf(m){ return 440 * Math.pow(2, (m-69)/12); }

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      master = audioCtx.createGain();
      master.gain.value = 0.85;
      master.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function piano(freq, time, dur, vol){
    var c = ensureAudio();
    var osc = c.createOscillator(), osc2 = c.createOscillator();
    var gain = c.createGain(), filter = c.createBiquadFilter(), g2 = c.createGain();
    osc.type = 'triangle'; osc2.type = 'sine';
    osc.frequency.value = freq; osc2.frequency.value = freq*2;
    g2.gain.value = 0.25;
    osc2.connect(g2); g2.connect(gain);
    osc.connect(gain);
    filter.type = 'lowpass'; filter.frequency.value = 3200; filter.Q.value = 0.4;
    gain.connect(filter); filter.connect(master);
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(vol, time+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, time+dur);
    osc.start(time); osc.stop(time+dur+0.05);
    osc2.start(time); osc2.stop(time+dur+0.05);
  }

  // 卡农 D 大调（简化）
  var chords = [[62,66,69],[57,61,64],[59,62,66],[54,57,61],[55,59,62],[62,66,69],[55,59,62],[57,61,64]];
  var bass = [50,45,47,42,43,50,43,45];
  var arpPattern = [0,1,2,3,2,1,0,1];
  var melody = [
    [74,1],[76,1],[78,1],[76,1],[74,1],[73,1],[74,1],[69,1],
    [71,1],[73,1],[74,1],[71,1],[69,1],[66,1],[69,1],[73,1],
    [74,1],[76,1],[78,1],[76,1],[74,1],[73,1],[74,1],[69,1],
    [71,1],[73,1],[74,1],[71,1],[69,1],[73,1],[74,1],[76,1]
  ];
  var bpm = 72, beat = 60/bpm, eighth = beat/2, loopDur = 32*beat;

  function chordNotes(ch){ return [ch[0], ch[1], ch[2], ch[0]+12]; }

  function playLoop(t){
    for(var m=0;m<8;m++){
      var mStart = t + m*4*beat;
      piano(mf(bass[m]), mStart, 4*beat*0.92, 0.20);
      var cn = chordNotes(chords[m]);
      for(var i=0;i<8;i++){
        piano(mf(cn[arpPattern[i]]), mStart + i*eighth, eighth*1.7, 0.15);
      }
    }
    var mt = t;
    for(var j=0;j<melody.length;j++){
      var n = melody[j][0], b = melody[j][1];
      piano(mf(n), mt, b*beat*0.95, 0.26);
      mt += b*beat;
    }
  }
  function scheduleLoop(t){
    playLoop(t);
    musicTimer = setTimeout(function(){ scheduleLoop(t + loopDur); }, (loopDur - 0.8)*1000);
  }
  var audioEl = document.getElementById('musicAudio');
  var musicBtn = document.getElementById('musicBtn');
  var usingMp3 = false;

  function setIcon(on){ musicBtn.textContent = on ? '🔊' : '🔇'; }

  function startSynth(){
    ensureAudio();
    musicOn = true;
    scheduleLoop(audioCtx.currentTime + 0.15);
    setIcon(true);
  }

  function startMusic(){
    // 优先播放用户自备的 music.mp3，加载失败则回退到合成音乐
    audioEl.volume = 0.9;
    var p = audioEl.play();
    if(p && p.then){
      p.then(function(){
        usingMp3 = true; musicOn = true; setIcon(true);
      }).catch(function(){
        usingMp3 = false; startSynth();
      });
    } else {
      startSynth();
    }
  }

  function toggleMusic(){
    if(usingMp3){
      if(audioEl.paused){ audioEl.play(); musicOn = true; setIcon(true); }
      else { audioEl.pause(); musicOn = false; setIcon(false); }
    } else {
      if(!audioCtx) return;
      musicOn = !musicOn;
      master.gain.setTargetAtTime(musicOn ? 0.85 : 0, audioCtx.currentTime, 0.05);
      setIcon(musicOn);
    }
  }
  musicBtn.addEventListener('click', toggleMusic);
})();
</script>
</body>
</html>
